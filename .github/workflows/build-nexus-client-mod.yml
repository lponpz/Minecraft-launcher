name: Build Nexus Client Mod

on:
  push:
    paths:
      - 'client-mod/**'
      - '.github/workflows/build-nexus-client-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build mod JAR
        run: gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Client-Mod-Minecraft-1.21.1
          path: client-mod/build/libs/*.jar
          if-no-files-found: error
